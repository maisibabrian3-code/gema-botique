<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gema Boutique | Executive Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --bg-dark: #0d0d0d; 
            --card-bg: #181818; 
            --white: #FFFFFF; 
            --text-muted: #a0a0a0; 
            --border: #2e2e2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--white); 
            padding: 20px 10px; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9); 
            overflow: hidden; 
            border: 1px solid var(--border); 
        }

        .header { 
            background: #121212; 
            padding: 1.5rem; 
            text-align: center; 
            border-bottom: 3px solid var(--gold); 
            position: relative;
        }

        .header h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 1.5rem; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }

        .header p { 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-top: 4px; 
        }

        .btn-logout {
            position: absolute;
            right: 15px;
            top: 20px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
        }

        .metrics-banner { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            padding: 15px; 
            background: #121212; 
            border-bottom: 1px solid var(--border); 
            text-align: center; 
        }

        .metric-card { 
            background: #1a1a1a; 
            padding: 12px; 
            border-radius: 10px; 
            border: 1px solid #2a2a2a; 
        }

        .metric-card span { 
            display: block; 
            font-size: 0.65rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .metric-card strong { 
            font-size: 1.1rem; 
            color: var(--gold); 
        }

        form { padding: 1.5rem; }
        
        .form-group { margin-bottom: 1.2rem; }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 0.4rem; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            color: var(--text-muted); 
        }

        input, select { 
            width: 100%; 
            padding: 0.8rem; 
            background: #121212; 
            border: 1px solid #333; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            color: #fff; 
            outline: none; 
        }

        input:focus, select:focus { border-color: var(--gold); }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .file-upload-box { 
            border: 2px dashed #444; 
            padding: 1rem; 
            text-align: center; 
            border-radius: 8px; 
            background: #121212; 
            cursor: pointer; 
        }
        .file-upload-box input { display: none; }

        .btn-submit { 
            background: linear-gradient(135deg, #d4af37, #b89628); 
            color: #0d0d0d; 
            border: none; 
            width: 100%; 
            padding: 0.9rem; 
            font-size: 0.85rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 0.5rem; 
        }

        #responseMessage { 
            margin-top: 1rem; 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 0.8rem; 
            display: none; 
        }

        .success { background: rgba(48, 209, 88, 0.15); color: #30d158; border: 1px solid rgba(48, 209, 88, 0.3); } 
        .error { background: rgba(255, 69, 58, 0.15); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.3); }

        .inventory-section { 
            padding: 1.5rem; 
            border-top: 1px solid var(--border); 
            background: #141414; 
        }

        .inventory-section h2 { 
            font-size: 1rem; 
            color: var(--gold); 
            margin-bottom: 12px; 
            font-family: 'Playfair Display', serif; 
            text-transform: uppercase;
        }

        .inventory-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #1c1c1c; 
            padding: 10px 12px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid #2e2e2e; 
        }

        .item-details h4 { font-size: 0.85rem; color: #fff; margin-bottom: 2px; }
        .item-details p { font-size: 0.7rem; color: var(--text-muted); }

        .item-actions { display: flex; gap: 6px; }

        .btn-action { 
            padding: 5px 10px; 
            font-size: 0.7rem; 
            font-weight: 600; 
            border-radius: 6px; 
            cursor: pointer; 
            border: none; 
            text-transform: uppercase;
        }

        .btn-toggle { background: #333; color: #fff; }
        .btn-toggle.out { background: #b89628; color: #000; }
        .btn-delete { background: rgba(255, 69, 58, 0.15); color: #ff453a; border: 1px solid rgba(255, 69, 58, 0.3); }

        @media (max-width: 500px) {
            .row { grid-template-columns: 1fr; }
            .inventory-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .item-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<div class="container">
   <div class="header">
    <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 8px;">
        <img src="/logo.png" alt="Gema Logo" style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--gold); object-fit: contain; background: #121212; padding: 3px; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);">
        <h1 style="margin: 0; font-size: 1.5rem;">GEMA BOUTIQUE</h1>
    </div>
    <p>Live Inventory & Revenue Control</p>
    <button class="btn-logout" onclick="logout()">Logout</button>
</div>

    <!-- Live Real Metrics -->
    <div class="metrics-banner">
        <div class="metric-card">
            <span>Total Units in Stock</span>
            <strong id="totalStockCount">0</strong>
        </div>
        <div class="metric-card">
            <span>Expected Revenue</span>
            <strong id="totalExpectedRevenue">Ksh 0</strong>
        </div>
    </div>

    <!-- Upload Form -->
    <form id="productForm">
        <div class="row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required onchange="updateDynamicFields()">
                    <option value="handbags">Handbags</option>
                    <option value="shoes">Shoes</option>
                    <option value="ladies-wear">Ladies Wear</option>
                </select>
            </div>
            <div class="form-group">
                <label for="title">Product Name</label>
                <input type="text" id="title" required placeholder="e.g. Velvet Tote Bag">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="price">Price (Ksh)</label>
                <input type="text" id="price" required placeholder="4500">
            </div>
            <div class="form-group">
                <label for="quantity">Initial Stock Qty</label>
                <input type="number" id="quantity" required min="1" value="5">
            </div>
        </div>

        <div class="form-group" id="specContainer">
            <label>Material / Style</label>
            <input type="text" id="dynamicSpec" placeholder="e.g. Genuine Leather">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="stockStatus">Stock Status</label>
                <select id="stockStatus">
                    <option value="In Stock">In Stock</option>
                    <option value="Limited Stock">Limited Stock</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tag">Promo Tag</label>
                <select id="tag">
                    <option value="New">New Arrival</option>
                    <option value="Hot">Hot / Trending</option>
                    <option value="Standard">Standard</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Product Photo (From Phone)</label>
            <div class="file-upload-box" onclick="document.getElementById('imageFile').click()">
                <p id="fileLabel">📁 Tap to choose photo from phone</p>
                <input type="file" id="imageFile" accept="image/*" required onchange="previewFile(this)">
            </div>
        </div>

        <button type="submit" class="btn-submit">Publish to Live Store</button>
        <div id="responseMessage"></div>
    </form>

    <!-- Interactive Inventory Manager -->
    <div class="inventory-section">
        <h2>Active Inventory Management</h2>
        <div id="inventoryList">
            <p style="color: #777; font-size: 0.8rem; text-align: center; padding: 10px;">No items currently posted.</p>
        </div>
    </div>
</div>

<script>
    let base64Image = "";

    function previewFile(input) {
        const file = input.files[0];
        if (file) {
            document.getElementById('fileLabel').textContent = "Selected: " + file.name;
            const reader = new FileReader();
            reader.onload = function(e) { base64Image = e.target.result; };
            reader.readAsDataURL(file);
        }
    }

    function updateDynamicFields() {
        const cat = document.getElementById('category').value;
        const container = document.getElementById('specContainer');
        if (cat === 'ladies-wear') {
            container.innerHTML = `<label>Sizes</label><input type="text" id="dynamicSpec" required placeholder="e.g. S, M, L, XL">`;
        } else if (cat === 'shoes') {
            container.innerHTML = `<label>EU Sizes</label><input type="text" id="dynamicSpec" required placeholder="e.g. EU 37, 38, 39">`;
        } else {
            container.innerHTML = `<label>Material / Style</label><input type="text" id="dynamicSpec" placeholder="e.g. Leather / Canvas">`;
        }
    }

    async function loadInventory() {
        try {
            const res = await fetch('/api/products');
            const products = await res.json();
            
            let totalUnits = 0;
            let totalRevenue = 0;
            const listContainer = document.getElementById('inventoryList');
            listContainer.innerHTML = '';

            if (products.length === 0) {
                listContainer.innerHTML = `<p style="color: #777; font-size: 0.8rem; text-align: center; padding: 10px;">No items currently posted.</p>`;
                document.getElementById('totalStockCount').textContent = 0;
                document.getElementById('totalExpectedRevenue').textContent = 'Ksh 0';
                return;
            }

            products.forEach(p => {
                const isItemActive = p.active && p.quantity > 0;
                if (isItemActive) {
                    totalUnits += p.quantity;
                    totalRevenue += ((p.numericPrice || 0) * p.quantity);
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = 'inventory-item';
                itemDiv.innerHTML = `
                    <div class="item-details">
                        <h4>${p.title} (${p.price})</h4>
                        <p>Stock Qty: <b>${p.quantity}</b> | Status: <span style="color: ${isItemActive ? '#30d158' : '#ff453a'}; font-weight: 600;">${isItemActive ? 'Active' : 'Out of Stock'}</span></p>
                    </div>
                    <div class="item-actions">
                        <button class="btn-action btn-toggle ${!isItemActive ? 'out' : ''}" onclick="toggleStatus('${p.id}', ${p.active})">${p.active ? 'Mark Out' : 'Activate'}</button>
                        <button class="btn-action btn-delete" onclick="deleteProduct('${p.id}')">Delete</button>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });

            document.getElementById('totalStockCount').textContent = totalUnits;
            document.getElementById('totalExpectedRevenue').textContent = 'Ksh ' + totalRevenue.toLocaleString();
        } catch (err) {
            console.error('Error loading inventory:', err);
        }
    }

    async function toggleStatus(id, currentActive) {
        await fetch(`/api/products/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: !currentActive, stockStatus: !currentActive ? 'In Stock' : 'Out of Stock' })
        });
        loadInventory();
    }

    async function deleteProduct(id) {
        if(confirm('Are you sure you want to delete this product permanently?')) {
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            loadInventory();
        }
    }

   async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/'; // Takes you straight back to the main homepage index.html
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('responseMessage');
        msgDiv.style.display = 'none';

        const payload = {
            category: document.getElementById('category').value,
            title: document.getElementById('title').value,
            price: document.getElementById('price').value,
            quantity: document.getElementById('quantity').value,
            spec: document.getElementById('dynamicSpec').value,
            stockStatus: document.getElementById('stockStatus').value,
            tag: document.getElementById('tag').value,
            imageUrl: base64Image
        };

        const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
            msgDiv.className = 'success';
            msgDiv.textContent = data.message;
            msgDiv.style.display = 'block';
            document.getElementById('productForm').reset();
            document.getElementById('fileLabel').textContent = "📁 Tap to choose photo from phone";
            base64Image = "";
            loadInventory();
        } else {
            msgDiv.className = 'error';
            msgDiv.textContent = data.error || 'Failed to post';
            msgDiv.style.display = 'block';
        }
    });

    loadInventory();
</script>

</body>
</html>
